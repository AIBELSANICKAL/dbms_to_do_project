<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - DBMS To-Do List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .login-box {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2em;
            color: #2d3748;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
        }
        button:hover { opacity: 0.9; }
        .message-box {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fed7d7;
            color: #742a2a;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                        <div class="message-box">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label for="username" style="display:block; text-align:left; margin-bottom:4px; color:#4a5568; font-weight:600;">Username</label>
            <input id="username" type="text" name="username" placeholder="Username" autocomplete="username" autofocus required>
            <label for="password" style="display:block; text-align:left; margin-bottom:4px; color:#4a5568; font-weight:600;">Password</label>
            <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Sign In</button>
        </form>
        <p style="margin-top: 15px; color: #4a5568;">Don't have an account? <a href="/register" style="color: #4facfe; text-decoration: none; font-weight: 700;">Register</a></p>
    </div>
</body>
</html>
